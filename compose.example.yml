services:
  posteryard:
    image: ghcr.io/sandobserver/posteryard:0.3
    container_name: posteryard
    restart: unless-stopped
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - PLEX_URL=http://192.168.1.10:32400
      - PLEX_TOKEN=${PLEX_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - DRY_RUN=true
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
