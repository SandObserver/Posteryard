[project]
name = "posteryard"
version = "0.10.5"
description = "Clean, consistent posters, backgrounds and episode stills for Plex, Jellyfin and Emby"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "apprise>=2.0,<3",
    "numpy>=2.3",
    "onnxruntime>=1.23,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.24; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "opencv-python-headless>=4.12,<6",
    "pillow>=12",
    "rapidocr>=3.9",
    "urllib3>=2.5,<3",
]

[project.scripts]
posteryard = "posteryard.cli:main"

[dependency-groups]
dev = [
    "fonttools>=4.60",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7",
    "pytest-xdist>=3.8.0",
    "resvg-py>=0.2",
    "ruff>=0.14",
]
workflows = [
    "actionlint-py>=1.7.12.25",
    "zizmor>=1.30.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13,<0.14"
# rapidocr depends on the GUI build of OpenCV. Both builds install the same cv2 module, so only the headless one is kept.
# onnxruntime depends on sympy only for its model tools. Inference does not import it.
override-dependencies = ["opencv-python; sys_platform == 'never'", "sympy; sys_platform == 'never'"]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "I", "N", "PTH", "PL", "C4", "C90"]
ignore = ["PLR2004", "PLR0911"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["cv2", "fontTools.*", "rapidocr", "resvg_py"]
ignore_missing_imports = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true
addopts = ["-q", "--cov", "--cov-report=term-missing:skip-covered"]
filterwarnings = ["error"]
faulthandler_timeout = 120
markers = [
    "slow: takes 3 seconds or more, mostly full-size renders. Skip with -m 'not slow' for a quick run.",
    "live: reads a real media server. Runs only with POSTERYARD_LIVE=1.",
]

[tool.coverage.run]
source = ["posteryard"]
branch = true

[tool.coverage.report]
fail_under = 85
