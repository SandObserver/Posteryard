name: Image

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: posteryard:ci
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: docker run --rm --entrypoint posteryard posteryard:ci --version
      - name: Check OCR runs without onnxruntime telemetry
        run: |
          set -o pipefail
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --entrypoint python posteryard:ci -c \
            "from PIL import Image; from posteryard import ocr; ocr.read(Image.new('RGB', (480, 720)))" 2>&1 | tee ocr.log
          ! grep -i telemetry ocr.log
      - name: Check the container becomes healthy
        run: |
          docker run -d --name posteryard --user 99:100 --read-only --tmpfs /tmp --tmpfs /data:uid=99,gid=100 --cap-drop ALL \
            -e TMDB_API_KEY=example -e PLEX_URL=http://127.0.0.1:9 -e PLEX_TOKEN=example \
            -e WEBHOOK_SECRET=example posteryard:ci
          for _ in $(seq 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' posteryard)
            [ "$state" = healthy ] && break
            sleep 5
          done
          docker logs posteryard
          test "$state" = healthy
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: posteryard:ci
          severity-cutoff: critical
          only-fixed: true
          output-format: table
          config: .grype.yaml
      # Keep these settings equal to the push job in release.yml.
      - id: rebuild
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=rebuild,tar=false
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Check a rebuild gives the tested image
        env:
          TESTED: ${{ fromJSON(steps.build.outputs.metadata)['containerimage.digest'] }}
          ARCH: ${{ matrix.arch }}
        run: |
          platform() { jq -r --arg arch "$ARCH" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' "$1"; }
          rebuilt=$(platform rebuild/index.json)
          if [ -z "$rebuilt" ]; then
            index=$(jq -r '.manifests[0].digest' rebuild/index.json)
            rebuilt=$(platform "rebuild/blobs/sha256/${index#sha256:}")
          fi
          echo "tested $TESTED, rebuilt $rebuilt"
          test -n "$TESTED" && test "$TESTED" = "$rebuilt"
          mkdir tested && echo "$TESTED" > "tested/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-${{ matrix.arch }}
          path: tested
          retention-days: 1
