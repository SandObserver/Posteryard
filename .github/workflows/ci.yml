name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor==1.30.1 --offline .github

  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: posteryard:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - run: docker run --rm --entrypoint posteryard posteryard:ci --version
      - name: Check OCR runs without onnxruntime telemetry
        run: |
          set -o pipefail
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --entrypoint python posteryard:ci -c \
            "from PIL import Image; from posteryard import ocr; ocr.read(Image.new('RGB', (480, 720)))" 2>&1 | tee ocr.log
          ! grep -i telemetry ocr.log
      - name: Check the container becomes healthy
        run: |
          docker run -d --name posteryard --user 99:100 --read-only --tmpfs /tmp --tmpfs /data:uid=99,gid=100 --cap-drop ALL \
            -e TMDB_API_KEY=example -e PLEX_URL=http://127.0.0.1:9 -e PLEX_TOKEN=example \
            -e WEBHOOK_SECRET=example posteryard:ci
          for _ in $(seq 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' posteryard)
            [ "$state" = healthy ] && break
            sleep 5
          done
          docker logs posteryard
          test "$state" = healthy
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: posteryard:ci
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  image-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: posteryard:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      # Emulated arm64 runs OCR several times slower than the read timeout allows, so call the engine directly.
      - run: >-
          docker run --rm --platform linux/arm64 --read-only --tmpfs /tmp --entrypoint python posteryard:arm64 -c
          "import numpy; from posteryard import ocr; ocr._read_pixels(numpy.zeros((720, 480, 3), numpy.uint8))"
