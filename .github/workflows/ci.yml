name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag posteryard:ci .
      - run: docker run --rm --entrypoint posteryard posteryard:ci --version
      - run: >-
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --entrypoint python posteryard:ci -c
          "from PIL import Image; from posteryard import ocr; ocr.read(Image.new('RGB', (480, 720)))"
      - name: Check the container becomes healthy
        run: |
          docker run -d --name posteryard --read-only --tmpfs /tmp --cap-drop ALL \
            -e TMDB_API_KEY=example -e PLEX_URL=http://127.0.0.1:9 -e PLEX_TOKEN=example \
            -e WEBHOOK_SECRET=example posteryard:ci
          for _ in $(seq 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' posteryard)
            [ "$state" = healthy ] && break
            sleep 5
          done
          docker logs posteryard
          test "$state" = healthy
